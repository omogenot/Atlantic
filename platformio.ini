; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;board = esp32-c3-devkitm-1
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
;upload_port = /dev/tty.usbmodem1101
;monitor_port = /dev/tty.usbmodem1101
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
lib_deps = 
	https://github.com/unreality/FujiHeatPump
	homespan/HomeSpan@^2.1.8

board_build.partitions = partitions_custom.csv

; =================================================================
; CONFIGURATION OTA (À activer une fois le premier flash USB effectué)
; =================================================================
; 3. Décommentez les lignes ci-dessous après avoir obtenu l'IP de l'ESP32
upload_protocol = espota
upload_port = 192.168.12.71 ; <-- Remplacez par l'adresse IP de votre ESP32-C3
upload_flags =
    --auth=homespan-ota
